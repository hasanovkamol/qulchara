<main class="min-h-screen bg-gray-50 text-gray-900 font-sans">
  <router-outlet></router-outlet>
</main>

<!-- Simple Bottom Navigation for authenticated users -->
<nav *ngIf="authService.isAuthenticated()" class="fixed bottom-0 w-full bg-white border-t border-gray-200 flex justify-around p-3 pb-5">
  <a *ngIf="authService.currentRole() === 'Broker'" routerLink="/broker" routerLinkActive="text-blue-600" class="flex flex-col items-center text-gray-500 hover:text-blue-600 transition-colors">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
    <span class="text-xs mt-1 font-medium">Asosiy</span>
  </a>

  <a *ngIf="authService.currentRole() === 'Admin'" routerLink="/admin" routerLinkActive="text-blue-600" class="flex flex-col items-center text-gray-500 hover:text-blue-600 transition-colors">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
    <span class="text-xs mt-1 font-medium">Brokerlar</span>
  </a>

  <a *ngIf="authService.currentRole() === 'SuperAdmin'" routerLink="/superadmin" routerLinkActive="text-blue-600" class="flex flex-col items-center text-gray-500 hover:text-blue-600 transition-colors">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
    <span class="text-xs mt-1 font-medium">Boshqaruv</span>
  </a>
</nav>
