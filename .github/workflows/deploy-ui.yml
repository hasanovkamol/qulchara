name: Deploy Angular Mini App to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'src/mini-app/**'
      - '.github/workflows/deploy-ui.yml'

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: src/mini-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'src/mini-app/package-lock.json'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Angular Project
        # The base-href must match the repository name for GitHub Pages: /qulchara/
        run: npm run build -- --base-href /qulchara/ --configuration production

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./src/mini-app/dist/mini-app/browser
          publish_branch: gh-pages
