version: '3.8'

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_Strong_Password_123!"
    ports:
      - "1434:1433"
    volumes:
      - sql_data:/var/opt/mssql

  api:
    build:
      context: .
      dockerfile: src/OpenBudget.Bot/Dockerfile
    ports:
      - "4041:4041"
    env_file:
      - .env
    environment:
      - ASPNETCORE_HTTP_PORTS=4041
      - ConnectionStrings__DefaultConnection=Server=db;Database=OpenBudgetDb;User Id=sa;Password=Your_Strong_Password_123!;TrustServerCertificate=true;
      - ASPNETCORE_ENVIRONMENT=Development
      - TelegramBot__MainBotToken=${TELEGRAM_MAIN_BOT_TOKEN}
      - TelegramBot__ErrorBotToken=${TELEGRAM_ERROR_BOT_TOKEN}
      - TelegramBot__ErrorChatId=${TELEGRAM_ERROR_CHAT_ID}
      - TelegramBot__SuperAdminIds__0=${TELEGRAM_SUPER_ADMIN_IDS}
      - Jwt__SecretKey=${JWT_SECRET_KEY}
    depends_on:
      - db

  ui:
    build:
      context: ./src/mini-app
      dockerfile: Dockerfile
    ports:
      - "4040:80"
    depends_on:
      - api

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --url http://api:4041 --no-autoupdate
    depends_on:
      - api
    restart: unless-stopped

volumes:
  sql_data:
